databases:
  - name: worktrack-db
    plan: free
    databaseName: worktrack
    user: worktrack

services:
  - type: web
    name: worktrack-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: worktrack-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: MQTT_HOST
        value: ""
