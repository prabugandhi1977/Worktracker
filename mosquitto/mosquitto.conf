# Local/dev broker configuration.
# PRD section 12 requires TLS + per-device credentials in production:
# before deploying beyond a local demo, disable allow_anonymous, configure
# a password_file or an auth plugin, and add a `listener 8883` with
# certfile/keyfile/cafile for MQTTS.

listener 1883
allow_anonymous true
persistence true
persistence_location /mosquitto/data/
log_dest stdout
